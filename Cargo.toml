[package]
name = "raytracer"
version = "0.1.0"
edition = "2021"

[dependencies]
raylib = "5.5"
# el raytracing es CPU pura: sin optimizaciones va ~20x mas lento,
# asi que tambien optimizamos el perfil de debug (cargo run sin --release)
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
